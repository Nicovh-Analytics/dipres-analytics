# Corre los tests en cada push y pull request. No usa datos reales ni red:
# los tests arman tablas de juguete y DIPRES_HOME apunta a una carpeta
# temporal. El pipeline completo se sigue corriendo en local (run.py).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          DIPRES_HOME: ${{ runner.temp }}/dipres-datos
